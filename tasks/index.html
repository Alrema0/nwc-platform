<!DOCTYPE html>
<html lang="ar" dir="rtl" data-standalone="tasks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الأعمال الموحدة | شركة المياه الوطنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#1976b8;--deep:#124b7a;--text:#263d50;--muted:#6b7d8d;--faint:#9aa9b6;--line:#e1e9ef;--bg:#f3f7fa;--card:#fff;--amber:#b98641;--good:#2e7d4f;--warn:#b7791f;--bad:#c2410c;--gray:#a9b6c1;--soft:#edf3f8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:13.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b8d4ea;outline-offset:2px}
svg.i{width:18px;height:18px;stroke-width:1.7;flex-shrink:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* Sidebar */
.sidebar{position:fixed;inset-block:0;right:0;width:248px;background:#fff;border-left:1px solid var(--line);padding:22px 16px 18px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--line)}
.brand img{width:46px;height:46px;object-fit:contain}
.brand b{display:block;font-size:14.5px;color:var(--deep)}
.brand small{display:block;font-size:11px;color:var(--muted)}
.nav-label{font-size:11px;color:var(--faint);margin:20px 10px 8px}
.nav-item{width:100%;display:flex;align-items:center;gap:11px;background:transparent;border:0;padding:11px 12px;color:#5f7182;margin-bottom:4px;text-align:right;border-radius:8px;font-weight:500}
.nav-item:hover{background:#f1f5f8}
.nav-item.active{background:var(--soft);color:var(--primary)}
.nav-item .count{margin-right:auto;background:#e3eaf0;color:#5f7182;font-size:11px;padding:0 7px;border-radius:5px;min-width:24px;text-align:center}
.nav-item.active .count{background:#d5e6f4;color:var(--primary)}
.nav-step{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#eef2f5;color:#7c8c99;flex-shrink:0}
.nav-item.active .nav-step{background:var(--primary);color:#fff}
.nav-final{margin-top:6px;border:1px dashed #c9d9e6}
.nav-final.active{border-style:solid;border-color:#b8d4ea}
.side-foot{margin-top:auto;background:#f5f8fa;border-radius:10px;padding:13px;font-size:11.5px;color:var(--muted)}
.side-foot b{color:var(--text);font-size:12px;display:block;margin-bottom:3px}
.side-foot .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.link-btn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--deep)}
.link-btn:hover{border-color:#b8d4ea}

/* Main */
main{margin-right:248px;padding:26px 30px 60px;min-height:100vh}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.crumb{font-size:11.5px;color:var(--faint);margin-bottom:4px}
h1{margin:0;font-size:24px;color:var(--deep);font-weight:700}
.topbar p{margin:4px 0 0;color:var(--muted);max-width:640px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:500;color:var(--text)}
.btn:hover{border-color:#bcd0df}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#1567a2}
.btn.danger{color:var(--bad);border-color:#f0c9bd;background:#fff8f5}
.btn.sm{padding:6px 10px;font-size:12px}

.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12.5px}
.stat-icon{width:32px;height:32px;border-radius:8px;background:var(--soft);color:var(--primary);display:grid;place-items:center}
.stat-value{font-size:27px;font-weight:700;color:var(--deep);margin-top:8px;line-height:1.2}
.stat-value small{font-size:12px;color:var(--muted);font-weight:500;margin-right:5px}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.stat.alert .stat-icon{background:#fdf0ea;color:var(--bad)}
.stat.ok .stat-icon{background:#eaf5ee;color:var(--good)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel h2{margin:0;font-size:15px;color:var(--deep)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head .hint{font-size:11.5px;color:var(--muted)}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mb{margin-bottom:16px}

/* Bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;background:#eef3f7;border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--primary);border-radius:5px;min-width:3px}
.bar-row .val{font-size:12px;color:var(--muted);min-width:70px;text-align:left}
.empty{color:var(--faint);text-align:center;padding:22px 8px;font-size:12.5px}

/* Distribution */
.dist{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden;background:#fff}
.dist span{display:block;height:100%;min-width:3px}
.dist span:first-child{border-radius:0 4px 4px 0}
.dist span:last-child{border-radius:4px 0 0 4px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:12px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend b{margin-right:auto;font-weight:600}
.legend em{font-style:normal;color:var(--faint);font-size:11px;min-width:34px;text-align:left}

.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.donut div{width:86px;height:86px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut b{font-size:21px;color:var(--deep);line-height:1}
.donut small{font-size:10.5px;color:var(--muted)}

/* Filters & table */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1 1 220px}
.search svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;padding:9px 34px 9px 12px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 12px;min-width:0}
.filters select{flex:0 1 170px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.8px;background:#fff}
th{background:#f6f9fb;color:var(--muted);font-weight:500;text-align:right;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid #eef2f5;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafcfd}
.name-cell b{display:block;font-weight:600;color:var(--text)}
.name-cell small{color:var(--faint);font-size:11px}
.name-btn{background:none;border:0;padding:0;text-align:right;color:var(--deep);font-weight:600}
.name-btn:hover{color:var(--primary);text-decoration:underline}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--primary);border-color:#b8d4ea}
.icon-btn.del:hover{color:var(--bad);border-color:#f0c9bd}
.icon-btn svg{width:15px;height:15px}
.table-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:10px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap;background:#eef3f7;color:#526577}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.b-blue{background:#e6f1fa;color:#155f95}
.b-green{background:#e7f4ec;color:#256b42}
.b-amber{background:#fbf2e3;color:#8a5a12}
.b-red{background:#fdece6;color:#a63a10}
.b-gray{background:#eef2f5;color:#5f7182}

.progress{display:flex;align-items:center;gap:8px;min-width:120px}
.progress .track{flex:1;height:7px}
.progress span{font-size:11.5px;color:var(--muted);min-width:32px}
.chip{display:inline-block;background:#f1f5f8;border-radius:5px;padding:1px 7px;font-size:11.5px;color:#55687a;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.done-check{width:20px;height:20px;border-radius:6px;border:1.5px solid #b8c7d3;background:#fff;display:grid;place-items:center;color:#fff;padding:0}
.done-check.on{background:var(--good);border-color:var(--good)}
.done-check svg{width:13px;height:13px;stroke-width:2.6}
tr.is-done .name-cell b{color:var(--faint);text-decoration:line-through}

/* Analysis */
.section-tri{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px}
.tri{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:3px solid var(--primary)}
.tri h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--deep)}
.tri h3 button{margin-right:auto;font-size:11.5px;background:none;border:0;color:var(--primary);padding:0}
.tri-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri-nums div{background:#f7fafc;border-radius:8px;padding:9px 10px}
.tri-nums b{display:block;font-size:19px;color:var(--deep);line-height:1.3}
.tri-nums small{font-size:11px;color:var(--muted)}
.tri-nums .bad b{color:var(--bad)}
.insights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.insight{background:linear-gradient(180deg,#f8fbfd,#fff);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.insight b{font-size:22px;color:var(--deep);display:block;line-height:1.3}
.insight span{font-size:12px;color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto}
.alert-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:#fbfcfd;border:1px solid #eef2f5}
.alert-item .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.alert-item .dot svg{width:15px;height:15px}
.alert-item b{display:block;font-size:12.8px;font-weight:600}
.alert-item small{color:var(--muted);font-size:11.5px}
.alert-item .tag{margin-right:auto;font-size:11px;white-space:nowrap}
.timeline{display:flex;flex-direction:column;gap:0;max-height:380px;overflow:auto}
.tl-item{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #f0f3f6;align-items:center}
.tl-item:last-child{border-bottom:0}
.tl-date{text-align:center;background:#f4f8fb;border-radius:8px;padding:5px 0;line-height:1.2}
.tl-date b{display:block;font-size:16px;color:var(--deep)}
.tl-date small{font-size:10.5px;color:var(--muted)}
.tl-item .t b{font-size:12.8px;font-weight:600;display:block}
.tl-item .t small{font-size:11.5px;color:var(--muted)}
.matrix th[colspan]{text-align:center;color:var(--deep);font-weight:600;background:#eef4f9}
.matrix th.sub{font-size:11px;padding:7px 10px}
.matrix td{white-space:nowrap}
.matrix th,.matrix td{padding:10px 9px}
.matrix .progress{min-width:96px}
.matrix .progress span{min-width:36px;text-align:left}
a.btn{text-decoration:none}
.matrix td.sep,.matrix th.sep{border-right:1px solid var(--line)}
.matrix tfoot td{font-weight:700;background:#f6f9fb;border-top:1px solid var(--line)}
.cellbar{display:flex;align-items:center;gap:6px}
.cellbar i{display:block;height:6px;border-radius:3px;background:var(--primary);opacity:.75}
.gap-flag{font-size:11px}
.filter-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar label{font-size:12px;color:var(--muted)}
.filter-bar select{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff}
.filter-bar .stamp{margin-right:auto;font-size:11.5px;color:var(--faint)}

.placeholder{min-height:calc(100vh - 160px);border:1.5px dashed #d3dfe8;border-radius:14px;background:repeating-linear-gradient(135deg,transparent 0 14px,#f7fafc 14px 15px)}
.embed{width:100%;height:calc(100vh - 150px);min-height:600px;border:1px solid var(--line);border-radius:12px;background:#fff;display:block}
body.embed-mode main{padding-bottom:16px}
.embed-card{display:flex;gap:16px;align-items:flex-start;max-width:720px}
.embed-card .stat-icon{width:44px;height:44px;border-radius:11px;flex-shrink:0}
.embed-card p{margin:6px 0 14px}
.tri-wait{display:flex;gap:10px;align-items:center;background:#f7fafc;border-radius:8px;padding:14px 12px;color:var(--muted);font-size:12.5px;min-height:62px}
.tri-wait svg{color:var(--faint)}
.sec-title{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--deep);margin:6px 0 12px}
/* Landing */
.sidebar,.mobile-nav{display:none!important}
main{margin-right:0!important;max-width:1280px;margin-inline:auto!important}
.appbar{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.appbar img{width:38px;height:38px;object-fit:contain}
.appbar .sys b{display:block;font-size:14.5px;color:var(--deep)}
.appbar .sys small{color:var(--muted);font-size:11.5px}
.back{margin-right:auto}
body.home-mode .appbar,body.home-mode .topbar{display:none}
.home{min-height:calc(100vh - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 0}
.home-logo{width:84px;height:84px;object-fit:contain;margin-bottom:10px}
.home-org{font-size:13px;color:var(--muted);letter-spacing:.3px}
.home h1{font-size:34px;margin:6px 0 34px;color:var(--deep)}
.home-sub{color:var(--muted);margin:0 0 34px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:min(940px,100%)}
.tile{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 22px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:center}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(18,75,122,.12);border-color:#b8d4ea}
.tile .ti{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;background:var(--soft);color:var(--primary);margin-bottom:6px}
.tile .ti svg{width:30px;height:30px;stroke-width:1.5}
.tile b{font-size:19px;color:var(--deep)}
.tile span{font-size:12.5px;color:var(--muted)}
.tile .no{position:absolute;top:14px;right:16px;font-size:11px;color:var(--faint)}
.tile .txt{display:flex;flex-direction:column;gap:4px}
.tile .meta{white-space:nowrap;margin-top:6px;font-size:12px;background:#f4f8fb;border-radius:20px;padding:3px 12px;color:#4f6477}
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:16px;padding:20px 22px;background:linear-gradient(90deg,#124b7a,#1976b8);border-color:transparent}
.tile.wide .ti{width:48px;height:48px;margin:0;background:rgba(255,255,255,.14);color:#fff}
.tile.wide b{color:#fff;font-size:18px}
.tile.wide span{color:#d6e7f4}
.tile.wide .txt{text-align:right;display:flex;flex-direction:column}
.home-foot{margin-top:30px;font-size:11.5px;color:var(--faint)}
@media (max-width:760px){.tiles{grid-template-columns:1fr}.home h1{font-size:26px}.tile{flex-direction:row;padding:18px;text-align:right;gap:14px}.tile .ti{margin:0;width:50px;height:50px}.tile .txt{display:flex;flex-direction:column}.tile .meta{margin:0 auto 0 0}.tile .no{display:none}}
body.standalone .back,body.standalone .tri h3 button{display:none}
[hidden]{display:none!important}
.pace-track{position:relative;overflow:visible}
.pace-track .fill{border-radius:5px}
.pace{position:absolute;top:-4px;width:2px;height:15px;background:#14324d;border-radius:1px;transform:translateX(50%)}
.stat .progress{margin-top:8px}
.who{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #b8d4ea;border-radius:10px;padding:10px 14px;margin-bottom:16px}
.who svg{color:var(--primary)}
.who b{display:block;color:var(--deep)}
.who span{font-size:12px;color:var(--muted)}
.staff-rows{display:flex;flex-direction:column;gap:12px}
.staff-row,.target-row{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(120px,1fr) 118px;gap:12px;align-items:center}
.staff-row>.badge,.target-row>.badge{justify-self:start}
.t-name b{display:block;font-size:13px;font-weight:600}
.t-name small{font-size:11.5px;color:var(--muted)}
.org-group{border:1px solid #edf1f4;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.org-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--deep)}
.org-head svg{width:16px;height:16px;color:var(--primary)}
.org-head span{font-size:11px}
.org-head .org-pct{margin-right:auto;font-weight:700;font-size:13px;color:var(--deep)}
.org-group .target-row{padding:8px 0;border-top:1px dashed #edf1f4}
.desc-cell{min-width:220px;max-width:380px}
.filter-bar select{max-width:230px}
.filter-bar input[type=date]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff}
.manage-list{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}
.m-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #eef2f5;border-radius:9px}
.m-row>div:first-child{flex:1;min-width:0}
.m-row b{display:block;font-size:13px}
.m-row small{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.share-row{display:flex;align-items:flex-end;gap:10px;padding:12px 0;border-bottom:1px solid #f0f3f6}
.share-row>div{flex:1;min-width:0}
.share-row b{display:block;font-size:13px}
.share-row small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.share-row input{width:100%;border:1px solid #d6e1ea;border-radius:7px;padding:7px 10px;font-size:12px;background:#f7fafc;text-align:left}
.resp-preview{margin-top:12px;display:flex;align-items:center;gap:8px;background:#f4f8fb;border-radius:8px;padding:9px 12px;font-size:12.5px}
@media (max-width:760px){.staff-row,.target-row{grid-template-columns:1fr auto}.staff-row .progress,.target-row .progress{grid-column:1/-1;grid-row:2}}
.sync-wrap{display:flex;align-items:center;gap:6px;margin-right:auto}
.sync{font-size:11.5px;padding:2px 10px;border-radius:20px;background:#eef3f7;color:#5f7182;white-space:nowrap}
.sync.ok{background:#e7f4ec;color:#256b42}.sync.error{background:#fdece6;color:#a63a10}.sync.loading,.sync.saving{background:#fbf2e3;color:#8a5a12}
.filter-bar .stamp{margin-right:0}
.lock-box{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 28px;text-align:center}
.lock-box .ti{width:56px;height:56px;border-radius:14px;display:inline-grid;place-items:center;background:var(--soft);color:var(--primary)}
.lock-box .ti svg{width:26px;height:26px}
.lock-box h2{margin:12px 0 2px;color:var(--deep)}
.lock-box form{display:flex;gap:8px;margin-top:16px}
.lock-box input{flex:1;min-width:0;border:1px solid #d6e1ea;border-radius:8px;padding:9px 12px;text-align:center;letter-spacing:4px;font-size:16px}
.lock-err{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:8px}
.tile.wide .lock-ic{color:#d6e7f4;display:grid;place-items:center}
.tile.wide .lock-ic svg{width:18px;height:18px}
body.home-mode .tile.wide .txt{justify-content:center}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(18,40,60,.38);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(760px,100%);box-shadow:0 20px 60px rgba(18,40,60,.25)}
.modal.sm{width:min(420px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px;color:var(--deep)}
.modal-body{padding:18px 22px}
.modal-foot{display:flex;gap:8px;justify-content:flex-start;padding:14px 22px;border-top:1px solid var(--line);background:#fafcfd;border-radius:0 0 14px 14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:500;color:#475b6d}
.field label i{color:var(--bad);font-style:normal}
.field input,.field select,.field textarea{border:1px solid #d6e1ea;border-radius:8px;padding:9px 11px;background:#fff;width:100%}
.field textarea{min-height:70px;resize:vertical}
.form-section{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--primary);border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:4px}
.errors{background:#fff6f3;border:1px solid #f3cfc2;color:#9a3412;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px}
.errors ul{margin:4px 0 0;padding-right:18px}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.detail-grid div{background:#f7fafc;border-radius:8px;padding:9px 12px}
.detail-grid small{display:block;color:var(--muted);font-size:11px}
.detail-grid b{font-size:13px;font-weight:600}
.sub-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sub-list div{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #eef2f5;border-radius:8px;font-size:12.5px}
.sub-list div .badge{margin-right:auto}
.sub-h{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.sub-h h4{margin:0;font-size:13.5px;color:var(--deep)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tip{position:fixed;z-index:70;background:#14324d;color:#fff;font-size:12px;padding:6px 10px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .1s;max-width:260px;line-height:1.5}
.tip.show{opacity:1}
.mobile-nav{display:none}
textarea.json-box{width:100%;min-height:200px;border:1px solid #d6e1ea;border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:11.5px;direction:ltr}

@media (max-width:1180px){.stats,.insights{grid-template-columns:repeat(2,minmax(0,1fr))}.section-tri,.cols-3{grid-template-columns:1fr}.cols-2-1{grid-template-columns:1fr}}
@media (max-width:900px){
  .sidebar{display:none}
  main{margin-right:0;padding:16px 14px 50px}
  .mobile-nav{display:flex;gap:6px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;position:sticky;top:0;z-index:20;align-items:center}
  .mobile-nav img{width:30px;height:30px}
  .mobile-nav button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;white-space:nowrap;font-size:12.5px}
  .mobile-nav button.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .cols-2{grid-template-columns:1fr}
  .form-grid,.detail-grid{grid-template-columns:1fr}
  .legend{grid-template-columns:1fr}
}
@media (max-width:520px){.stats,.insights{grid-template-columns:1fr}.tri-nums b{font-size:16px}}
</style>
</head>

function seedWork(){
  let x=20261118; const rnd=()=>{x=(x*1103515245+12345)%2147483648;return x/2147483648;};

    T('d4','المتابعة الميدانية لأعمال المقاولين',DEPS[1],'o1','زيارة',96,60),
    T('d5','جولات التفتيش على السلامة في المواقع',DEPS[2],'o4','جولة',120,70),
    T('d7','إغلاق ملاحظات التدقيق',DEPS[2],'o4','ملاحظة',50,40),
    T('d6','رفع جاهزية أنظمة التحكم والقياس',DEPS[3],'o1','مهمة',40,20)];
  const S=(id,name,dep,role,mv,vt,tt,f,em)=>({id,name,departmentName:dep,role,monthlyVisits:mv,_v:vt,_t:tt,_f:f,_e:em});
  const staff=[
    S('s1','م. ريم السبيعي',DEPS[0],'مشرفة صيانة',12,'d1','d3',1.15,1),
    S('s2','م. عبدالله الزهراني',DEPS[0],'مهندس تشغيل',10,'d1','d3',1.1,1),
    S('s3','أ. سلطان الغامدي',DEPS[0],'فني ميداني',16,'d1','d3',0.7,1),
    S('s4','م. سارة القحطاني',DEPS[1],'مهندسة مشاريع',8,'d4','d4',1.2,0),
    S('s5','أ. تركي المطيري',DEPS[2],'مفتش سلامة',10,'d5','d7',0.95,0),
    S('s6','أ. فهد الدوسري',DEPS[3],'مهندس أنظمة',4,'d6','d6',1.3,0)];
  const TXT={
    d1:['فحص المضخات وقراءة العدادات وتسجيل الضغوط','فحص الصمامات وتنظيف غرف التحكم','التأكد من مستويات الخزان وجودة المياه','فحص اللوحات الكهربائية والتأريض'],
    d3:['حصر مواقع التسرب في الشبكة وإعداد تقرير','استبدال عداد تالف ومعالجة التسرب حوله','تحديد تسرب بالحساس الصوتي وإصلاحه'],
    d4:['متابعة أعمال المقاول ومطابقة الكميات المنفذة','حضور اجتماع الموقع ومراجعة الجدول الزمني','فحص جودة أعمال التمديدات','مراجعة مستخلص المقاول'],
    d5:['جولة تفتيش على اشتراطات السلامة في الموقع','التحقق من معدات الوقاية الشخصية للعمال','فحص طفايات الحريق ومخارج الطوارئ'],
    d7:['إغلاق ملاحظة تدقيق تخص لوحات الإرشاد','تحديث سجل المخاطر وإغلاق ملاحظتين'],
    d6:['فحص أجهزة القياس عن بعد ووحدات الاتصال','ضبط حساسات الضغط في نظام التحكم','تحديث برمجيات وحدات التحكم الطرفية'],
    d2:['معالجة كسر في خط توزيع وإعادة الخدمة','إصلاح تسرب في صمام رئيسي','إعادة تشغيل مضخة متوقفة بعد انقطاع الكهرباء','معالجة انخفاض الضغط في الحي بعد بلاغ عميل']};
  const entries=[]; let n=0;
  const now=new Date();
  for(const s of staff){
    for(let d=-80; d<=0; d++){
      const day=new Date(now); day.setDate(day.getDate()+d); const iso=isoD(day), wd=day.getDay(), work=wd<=4;
      const mk=(type,target,extra={})=>entries.push({id:'e'+(++n),date:iso,staffId:s.id,type,targetId:target,description:pick(TXT[target]),site:type==='مهمة'&&target==='d6'?'':pick(SITES),qty:1,status:'منجز',reportTime:'',arrivalTime:'',...extra});
      const f=d>-18?s._f:Math.min(1.05,s._f+0.1);
      if(work&&rnd()<s.monthlyVisits*f/22) mk('زيارة دورية',s._v);
      if(work&&rnd()<0.12) mk('مهمة',s._t,{status:d>-3&&rnd()<0.5?'قيد العمل':'منجز'});
      if(s._e&&rnd()<0.09){
        const h=Math.floor(rnd()*24), mi=Math.floor(rnd()*60), resp=Math.round(25+Math.pow(rnd(),1.6)*190);
        const rep=new Date(day.getFullYear(),day.getMonth(),day.getDate(),h,mi); const arr=new Date(rep.getTime()+resp*6e4);
        const dt=v=>isoD(v)+'T'+String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
        mk('زيارة طارئة','d2',{reportTime:dt(rep),arrivalTime:dt(arr)});
      }
    }
    delete s._v; delete s._t; delete s._f; delete s._e;
  }
  entries.sort((a,b)=>b.date.localeCompare(a.date));
  return {orgTargets,deptTargets,staff,entries,slaMinutes:120,updated:new Date().toISOString()};
}

async function sheetCall(body){
  const opt=body?{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'}}:{};
  const r=await fetch(SHEET_URL,{...opt,redirect:'follow'}); const d=await r.json(); if(!d.ok) throw new Error(d.error||'خطأ غير معروف'); return d.data; }

/* ---------- Calculations ---------- */
const respMin=e=>{const a=Date.parse(e.arrivalTime),r=Date.parse(e.reportTime);return isNaN(a)||isNaN(r)?null:Math.max(0,Math.round((a-r)/6e4));};
function fmtDur(m){ if(m==null||isNaN(m)) return '-'; m=Math.round(m); if(m<60) return m+' دقيقة'; const h=Math.floor(m/60),r=m%60; return h+' س'+(r?' '+r+' د':''); }
function periodRange(p,opt){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth(), dim=new Date(y,m+1,0).getDate(), f=n.getDate()/dim;
  const first=(yy,mm)=>isoD(new Date(yy,mm,1)), last=(yy,mm)=>isoD(new Date(yy,mm+1,0));
  if(p==='custom'){ let a=(opt&&opt.from)||first(y,m), b=(opt&&opt.to)||TODAY; if(b<a) [a,b]=[b,a];
    const days=daysBetween(a,b)+1, done=b<=TODAY?days:Math.max(0,daysBetween(a,TODAY)+1);
    return {from:a,to:b,months:days/30.44,frac:days?Math.min(1,done/days):1,label:'الفترة المحددة'}; }
  if(p==='prev') return {from:first(y,m-1),to:last(y,m-1),months:1,frac:1,label:'الشهر الماضي'};
  if(p==='q') return {from:first(y,m-2),to:TODAY,months:3,frac:(2+f)/3,label:'آخر ٣ أشهر'};
  if(p==='year') return {from:first(y,0),to:TODAY,months:m+1,frac:(m+f)/(m+1),label:'هذه السنة'};
  return {from:first(y,m),to:TODAY,months:1,frac:f,label:'هذا الشهر'};
}
const PERIODS=[['month','هذا الشهر'],['prev','الشهر الماضي'],['q','آخر ٣ أشهر'],['year','هذه السنة'],['custom','من تاريخ إلى تاريخ']];
const YSTART=isoD(new Date(new Date().getFullYear(),0,1));
const YFRAC=(()=>{const n=new Date(),s=new Date(n.getFullYear(),0,1),e=new Date(n.getFullYear()+1,0,1);return (n-s)/(e-s);})();
function tAch(t){ return (Number(t.prior)||0)+W.entries.filter(e=>e.targetId===t.id&&e.date>=YSTART&&e.date<=TODAY&&e.status!=='قيد العمل').reduce((s,e)=>s+(Number(e.qty)||1),0); }
function tStatus(t){ const a=tAch(t), v=Number(t.targetValue)||0; if(v&&a>=v) return 'محقق'; if(a>=v*YFRAC*0.95) return 'على المسار'; return 'متأخر عن المسار'; }
const T_ST_BADGE={'محقق':'b-green','على المسار':'b-blue','متأخر عن المسار':'b-red'};
const V_ST_BADGE={'مكتمل':'b-green','على المسار':'b-blue','متأخر':'b-red'};

// Everything for one scope (period + department + employee)
function scope(f){
  const R=periodRange(f.period||'month',f);
  const S=W.staff.filter(s=>(!f.dep||s.departmentName===f.dep)&&(!f.staff||s.id===f.staff));
  const ids=new Set(S.map(s=>s.id));
  const E=W.entries.filter(e=>ids.has(e.staffId)&&e.date>=R.from&&e.date<=R.to);
  const per=E.filter(e=>e.type==='زيارة دورية'), em=E.filter(e=>e.type==='زيارة طارئة'), tasks=E.filter(e=>e.type==='مهمة');
  const required=Math.round(S.reduce((s,x)=>s+(Number(x.monthlyVisits)||0),0)*R.months), expected=Math.round(required*R.frac);
  const rts=em.map(respMin).filter(v=>v!=null), avgResp=rts.length?rts.reduce((a,b)=>a+b,0)/rts.length:null;
  const inSla=rts.filter(v=>v<=W.slaMinutes).length;
  const staffRows=S.map(s=>{const mine=E.filter(e=>e.staffId===s.id), done=mine.filter(e=>e.type==='زيارة دورية').length, req=Math.round((Number(s.monthlyVisits)||0)*R.months), exp=req*R.frac;
    const ems=mine.filter(e=>e.type==='زيارة طارئة'), r=ems.map(respMin).filter(v=>v!=null);
    return {s,done,req,exp,st:req&&done>=req?'مكتمل':done>=exp*0.9?'على المسار':'متأخر',em:ems.length,avg:r.length?r.reduce((a,b)=>a+b,0)/r.length:null,sla:r.length?pct(r.filter(v=>v<=W.slaMinutes).length,r.length):null,entries:mine.length};});
  return {R,S,E,per,em,tasks,required,expected,avgResp,inSla,rts,staffRows};
}
function paceBar(v,max,pace,color){ const w=max?Math.min(100,v/max*100):0, p=max?Math.min(100,pace/max*100):0;
  return `<div class="progress"><div class="track pace-track"><div class="fill" style="width:${w}%;${color?'background:'+color:''}"></div>${pace!=null?`<i class="pace" style="right:${p}%" data-tip="المتوقع حتى اليوم: ${fmt(pace,0)}"></i>`:''}</div><span class="num">${max?Math.round(v/max*100):0}%</span></div>`; }

function bars(entries,fmtv=v=>fmt(v),tipf){ if(!entries.length) return '<div class="empty">لا توجد بيانات بعد</div>'; const max=Math.max(...entries.map(e=>e[1]),1);
  return `<div class="bars">${entries.map(([l,v,c])=>`<div class="bar-row" data-tip="${esc(tipf?tipf(l,v):l+': '+fmtv(v))}"><span class="lbl">${esc(l)}</span><div class="track"><div class="fill" style="width:${v/max*100}%;${c?'background:'+c:''}"></div></div><span class="val num">${fmtv(v)}</span></div>`).join('')}</div>`; }
function dist(order,counts,colors){ const total=order.reduce((s,k)=>s+(counts[k]||0),0);
  if(!total) return '<div class="empty">لا توجد بيانات بعد</div>';
  return `<div class="dist" role="img" aria-label="${order.map(k=>k+' '+(counts[k]||0)).join('، ')}">${order.filter(k=>counts[k]).map(k=>`<span style="flex:${counts[k]};background:${colors[k]}" data-tip="${esc(k)}: ${counts[k]} (${pct(counts[k],total)}%)"></span>`).join('')}</div>
  <div class="legend">${order.map(k=>`<div><i style="background:${colors[k]}"></i>${esc(k)}<b class="num">${counts[k]||0}</b><em class="num">${pct(counts[k]||0,total)}%</em></div>`).join('')}</div>`; }
const countBy=(arr,f)=>arr.reduce((m,x)=>{const k=f(x);m[k]=(m[k]||0)+1;return m;},{});
const sumBy=(arr,kf,vf)=>arr.reduce((m,x)=>{const k=kf(x);m[k]=(m[k]||0)+vf(x);return m;},{});
const sorted=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
function progress(v,c){return `<div class="progress"><div class="track"><div class="fill" style="width:${v}%;${c?'background:'+c:''}"></div></div><span class="num">${v}%</span></div>`;}

   Light protection: the PIN is checked in the browser (stored as a hash, not as text). */
const MANAGER_PIN_HASH='bada65fb169c57914c7d836655a70882d50c20aac2a25021e244dcaea64d4490';
function mgrOk(){ try{ return sessionStorage.getItem('nwc-mgr')===MANAGER_PIN_HASH; }catch(e){ return !!window.__mgr; } }
async function sha256(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function viewLock(){
  $('#view').innerHTML=`<section class="lock-box"><span class="ti">${icon('lock')}</span><h2>لوحة المتابعة التنفيذية</h2><p class="muted">أدخل رمز الدخول</p>
    <form id="mgr-form"><input id="mgr-pin" type="password" inputmode="numeric" autocomplete="off" aria-label="رمز الدخول"><button class="btn primary" type="submit">دخول</button></form><div id="mgr-err" class="lock-err" role="alert"></div></section>`;
  $('#mgr-pin').focus();
  $('#mgr-form').onsubmit=async e=>{ e.preventDefault(); const h=await sha256('nwc-mgr:'+toEn($('#mgr-pin').value.trim()));
    if(h===MANAGER_PIN_HASH){ try{sessionStorage.setItem('nwc-mgr',h);}catch(_){window.__mgr=1;} render(); }
    else { $('#mgr-err').textContent='الرمز غير صحيح'; $('#mgr-pin').select(); } };
}

    {k:'name',l:'اسم الموظف',req:1},{k:'role',l:'المسمى الوظيفي'},
    {k:'departmentName',l:'الإدارة',list:'deps',req:1},{k:'monthlyVisits',l:'الزيارات الدورية المطلوبة شهرياً',type:'num',req:1}]},
  dtargets:{arr:()=>W.deptTargets,single:'مستهدف',title:'مستهدفات الإدارات والمنشأة',fields:[
    {k:'title',l:'مستهدف الإدارة',req:1,full:1},
    {k:'orgTargetId',l:'مستهدف المنشأة المرتبط',type:'select',opts:()=>W.orgTargets.map(o=>({v:o.id,l:o.title})),req:1,full:1},
    {k:'departmentName',l:'الإدارة',list:'deps',req:1},{k:'unit',l:'وحدة القياس',ph:'زيارة، بلاغ، موقع…',req:1},
    {k:'targetValue',l:'المستهدف السنوي',type:'num',req:1},{k:'prior',l:'المنجز قبل استخدام المنصة',type:'num',ph:'0'}]},
  otargets:{arr:()=>W.orgTargets,single:'مستهدف للمنشأة',title:'مستهدفات المنشأة',fields:[{k:'title',l:'مستهدف المنشأة',req:1,full:1}]}
};
function validate(kind,o){
  const e=[];
  for(const f of ENT[kind].fields) if(f.req&&String(o[f.k]??'').trim()==='') e.push(`${f.l}: يرجى استكمال الحقل.`);
  if(kind==='entries'){
    if(o.qty!==''&&!(Number(o.qty)>0)) e.push('الكمية المنجزة رقم أكبر من صفر.');
    if(o.type!=='مهمة'&&!String(o.site||'').trim()) e.push('الموقع / المنشأة: مطلوب للزيارات.');
    if(o.date>TODAY) e.push('التاريخ لا يكون في المستقبل.');
    if(o.type==='زيارة طارئة'){ if(!o.reportTime||!o.arrivalTime) e.push('الزيارة الطارئة تحتاج وقت البلاغ ووقت الوصول لحساب سرعة الاستجابة.'); else if(Date.parse(o.arrivalTime)<Date.parse(o.reportTime)) e.push('وقت الوصول يسبق وقت البلاغ.'); }
  }
  if(kind==='staff'&&!(Number(o.monthlyVisits)>=0)) e.push('الزيارات المطلوبة رقم صفر أو أكثر.');
  if(kind==='dtargets'){ if(!(Number(o.targetValue)>0)) e.push('المستهدف السنوي رقم أكبر من صفر.'); if(o.prior!==''&&!(Number(o.prior)>=0)) e.push('المنجز السابق رقم صفر أو أكثر.'); }
  return [...new Set(e)];
}
function openForm(kind,id,back){
  const cfg=ENT[kind], rec=id?cfg.arr().find(x=>x.id===id):null, o={...(rec||{})};
  if(!rec&&kind==='entries'){ o.date=TODAY; o.status='منجز'; o.qty=1; if(F.tasks.staff) o.staffId=F.tasks.staff; }
  const field=f=>{ const v=o[f.k]??''; const idA=`fld-${f.k}`; let inp;
    if(f.type==='select') inp=`<select id="${idA}" name="${f.k}"><option value="">- اختر -</option>${f.opts().map(x=>`<option value="${esc(x.v)}" ${String(x.v)===String(v)?'selected':''}>${esc(x.l)}</option>`).join('')}</select>`;
    else if(f.type==='group') inp=`<select id="${idA}" name="${f.k}"><option value="">- اختر المستهدف -</option>${f.opts().map(g=>`<optgroup label="${esc(g.group)}">${g.opts.map(x=>`<option value="${esc(x.v)}" ${x.v===v?'selected':''}>${esc(x.l)}</option>`).join('')}</optgroup>`).join('')}</select>`;
    else if(f.type==='area') inp=`<textarea id="${idA}" name="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else inp=`<input id="${idA}" name="${f.k}" type="${f.type==='num'?'text':f.type||'text'}" ${f.type==='num'?'inputmode="numeric"':''} ${f.list?`list="dl-${f.list}"`:''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
    return `<div class="field ${f.full?'full':''}" ${f.when?`data-when="${esc(f.when)}"`:''}><label for="${idA}">${f.l}${f.req||f.when?' <i>*</i>':''}</label>${inp}</div>`; };
  openModal(`${head((rec?'تعديل ':'إضافة ')+cfg.single)}<form id="ent-form" novalidate><div class="modal-body"><div id="form-errors"></div><div class="form-grid">${cfg.fields.map(field).join('')}</div>
    ${kind==='entries'?'<div id="resp-preview" class="resp-preview" hidden></div>':''}
    <datalist id="dl-deps">${[...new Set([...DEPS,...workDepts()])].map(d=>`<option value="${esc(d)}">`).join('')}</datalist><datalist id="dl-sites">${[...new Set([...SITES,...W.entries.map(e=>e.site).filter(Boolean)])].map(d=>`<option value="${esc(d)}">`).join('')}</datalist></div>
    <div class="modal-foot"><button class="btn primary" type="submit">${icon('check')}حفظ</button><button class="btn" type="button" ${back?`data-manage="${back}"`:'data-close'}>إلغاء</button></div></form>`);
  const form=$('#ent-form');
  const sync=()=>{ const t=form.elements.type?form.elements.type.value:''; form.querySelectorAll('[data-when]').forEach(el=>el.hidden=el.dataset.when!==t);
    const pv=$('#resp-preview'); if(pv){ const r=respMin({reportTime:form.elements.reportTime.value,arrivalTime:form.elements.arrivalTime.value}); pv.hidden=!(t==='زيارة طارئة'&&r!=null); if(r!=null) pv.innerHTML=`${icon('clock')} زمن الاستجابة: <b>${fmtDur(r)}</b> ${r<=W.slaMinutes?badge('ضمن المعيار','b-green'):badge('تجاوز المعيار','b-red')}`; } };
  form.addEventListener('input',sync); form.addEventListener('change',sync); sync();
  if(kind==='entries'&&form.elements.staffId) form.elements.staffId.addEventListener('change',()=>{ const s=staffById(form.elements.staffId.value), tg=form.elements.targetId; if(s&&!tg.value){ const t=W.deptTargets.find(x=>x.departmentName===s.departmentName); if(t) tg.value=t.id; } });
  form.addEventListener('submit',e=>{ e.preventDefault();
    const fd=new FormData(form), n={...(rec||{})};
    for(const f of cfg.fields){ const raw=String(fd.get(f.k)??'').trim(); n[f.k]=f.type==='num'?(raw===''?'':Number(toEn(raw))):raw; }
    if(kind==='entries'){ if(n.qty==='') n.qty=1; if(n.type!=='زيارة طارئة'){ n.reportTime=''; n.arrivalTime=''; } }
    if(kind==='dtargets'&&n.prior==='') n.prior=0;
    if(!rec) n.id=uid(kind[0]);
    const errs=validate(kind,n);
    if(errs.length){ $('#form-errors').innerHTML=`<div class="errors" role="alert"><b>يرجى مراجعة ما يلي:</b><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; $('#modal-bg').scrollTop=0; return; }
    if(rec) Object.assign(rec,n); else cfg.arr().unshift(n);
    const msg=rec?'تم حفظ التعديلات':kind==='entries'?'تم تسجيل العمل':'تمت الإضافة';
    if(back) manage(back); else closeModal();
    if(SHEET_URL){ render(); push({action:'upsert',kind,record:n},msg); } else { saveWork(); render(); toast(msg); }
  });
}
function manage(kind){
  const cfg=ENT[kind];
  const row=x=>{ if(kind==='staff') return `<b>${esc(x.name)}</b><small>${esc(x.role||'')} · ${esc(x.departmentName)} · <span class="num">${x.monthlyVisits}</span> زيارة شهرياً</small>`;
    if(kind==='dtargets') return `<b>${esc(x.title)}</b><small>${esc(x.departmentName)} · <span class="num">${fmt(x.targetValue,0)}</span> ${esc(x.unit)} سنوياً · ${esc((otById(x.orgTargetId)||{}).title||'غير مرتبط')}</small>`;
    return `<b>${esc(x.title)}</b><small><span class="num">${W.deptTargets.filter(t=>t.orgTargetId===x.id).length}</span> مستهدف إدارة مرتبط</small>`; };
  const extra=kind==='staff'?`<div class="field" style="margin-bottom:14px;max-width:320px"><label for="sla">معيار سرعة الاستجابة للزيارات الطارئة (بالدقائق)</label><input id="sla" inputmode="numeric" value="${W.slaMinutes}"></div>`:
    kind==='dtargets'?`<div class="tabs"><button class="btn sm" data-manage="otargets">${icon('analysis')}مستهدفات المنشأة (${W.orgTargets.length})</button></div>`:
    `<div class="tabs"><button class="btn sm" data-manage="dtargets">← مستهدفات الإدارات</button></div>`;
  openModal(`${head(cfg.title)}<div class="modal-body">${extra}<div class="manage-list">${cfg.arr().length?cfg.arr().map(x=>`<div class="m-row"><div>${row(x)}</div><div class="row-actions"><button class="icon-btn" data-edit="${kind}:${x.id}" aria-label="تعديل">${icon('edit')}</button><button class="icon-btn del" data-del="${kind}:${x.id}" aria-label="حذف">${icon('trash')}</button></div></div>`).join(''):'<div class="empty">لا توجد عناصر بعد</div>'}</div></div>
    <div class="modal-foot"><button class="btn primary" data-add="${kind}" data-back="${kind}">${icon('plus')}إضافة ${cfg.single}</button><button class="btn" data-close>إغلاق</button></div>`);
  const sla=$('#sla'); if(sla) sla.onchange=()=>{const v=Number(toEn(sla.value)); if(v>0){W.slaMinutes=Math.round(v);render();push({action:'setting',key:'slaMinutes',value:W.slaMinutes},'تم تحديث المعيار');} else { sla.value=W.slaMinutes; toast('أدخل عدد دقائق صحيحاً'); } };
}
function confirmDelete(kind,id){
  const cfg=ENT[kind], rec=cfg.arr().find(x=>x.id===id); if(!rec) return;
  const back=kind==='entries'?'':kind;
  let block='';
  if(kind==='staff'){const c=W.entries.filter(e=>e.staffId===id).length; if(c) block=`لا يمكن حذف الموظف لأن له ${c} عمل مسجل. احذف أعماله أولاً أو عدّل بياناته.`;}
  if(kind==='dtargets'){const c=W.entries.filter(e=>e.targetId===id).length; if(c) block=`لا يمكن حذف المستهدف لأن ${c} عمل مرتبط به.`;}
  if(kind==='otargets'){const c=W.deptTargets.filter(t=>t.orgTargetId===id).length; if(c) block=`لا يمكن حذف مستهدف المنشأة لأن ${c} مستهدف إدارة مرتبط به.`;}
  const name=rec.name||rec.title||rec.description;
  openModal(`${head('حذف '+cfg.single)}<div class="modal-body">${block?`<div class="errors" role="alert">${esc(block)}</div>`:`<p style="margin-top:0">هل تريد حذف «<b>${esc(name)}</b>»؟ لا يمكن التراجع عن الحذف.</p>`}</div>
    <div class="modal-foot">${block?'':`<button class="btn danger" id="do-del">${icon('trash')}حذف</button>`}<button class="btn" ${back?`data-manage="${back}"`:'data-close'}>${block?'رجوع':'إلغاء'}</button></div>`,true);
  const b=$('#do-del'); if(b) b.onclick=()=>{ const arr=cfg.arr(); arr.splice(arr.indexOf(rec),1); if(back) manage(back); else closeModal(); render(); push({action:'delete',kind,id},'تم الحذف'); };
}

/* ---------- Share & data ---------- */
function platformBase(){ try{ return new URL(STANDALONE?'../':'./',location.href).href.split('#')[0]; }catch(e){ return ''; } }
function shareLinks(){
  const base=platformBase(), http=location.protocol.startsWith('http')&&!/claude/.test(location.hostname);
  const sec=current==='home'?null:current;
  const sep={tasks:base+'tasks/',analysis:base+'analysis/',projects:PAGES.projects,assets:PAGES.assets};
  const line=(label,url,note)=>`<div class="share-row"><div><b>${label}</b><small>${note}</small><input readonly value="${esc(url||'')}" placeholder="لا يوجد رابط بعد" dir="ltr"></div>${url?`<button class="btn sm" data-copy="${esc(url)}">نسخ</button>`:''}</div>`;
  openModal(`${head('مشاركة')}<div class="modal-body">
    ${!http?'<div class="errors" style="background:#f4f8fb;border-color:#d6e1ea;color:#3d5366">الروابط التالية تعمل بعد نشر المنصة على موقعها.</div>':''}
    ${sec?line('هذا القسم كصفحة منفصلة',sep[sec],'يفتح القسم وحده بدون الواجهة الرئيسية'):''}
    ${line('المنصة كاملة',http?base:'https://alrema0.github.io/nwc-platform/','الواجهة الرئيسية وكل الأقسام')}
    ${sec?'':['assets','projects','tasks','analysis'].map(k=>line('صفحة '+VIEWS.find(v=>v.id===k).label+' منفصلة',k==='tasks'||k==='analysis'?(http?sep[k]:'https://alrema0.github.io/nwc-platform/'+k+'/'):sep[k],'')).join('')}
  </div><div class="modal-foot"><button class="btn" data-close>إغلاق</button></div>`);
}
function dataMenu(){
  openModal(`${head('بيانات المهام')}<div class="modal-body"><p class="muted" style="margin-top:0">${SHEET_URL?'بيانات المهام محفوظة في جدول البيانات المشترك، منفصلة عن الأقسام الأخرى.':'بيانات المهام تُحفظ في هذا المتصفح، منفصلة عن الأقسام الأخرى.'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">نسخ البيانات</button><button class="btn" data-act="import">استيراد</button><button class="btn danger" data-act="reset">${SHEET_URL?'رفع بيانات تجريبية إلى الجدول':'استعادة البيانات التجريبية'}</button></div></div>
    <div class="modal-foot"><button class="btn" data-close>إغلاق</button></div>`,true);
}
function exportData(){
  const json=JSON.stringify({section:'work',...W},null,1);
  openModal(`${head('نسخ بيانات المهام')}<div class="modal-body"><p class="muted" style="margin-top:0">انسخ النص واحفظه، ثم استخدم «استيراد» في متصفح أو جهاز آخر.</p><textarea class="json-box" readonly id="jbox">${esc(json)}</textarea></div><div class="modal-foot"><button class="btn primary" data-copy-box>نسخ</button><button class="btn" data-close>إغلاق</button></div>`);
}
function importData(){
  openModal(`${head('استيراد بيانات المهام')}<div class="modal-body"><div id="imp-err"></div><p class="muted" style="margin-top:0">الصق النص المنسوخ من قسم المهام أو اختر ملف JSON. يستبدل الاستيراد بيانات المهام الحالية.</p><textarea class="json-box" id="jin"></textarea><input type="file" id="jfile" accept=".json,application/json" style="margin-top:10px"></div><div class="modal-foot"><button class="btn primary" id="doimp">استيراد</button><button class="btn" data-close>إلغاء</button></div>`);
  $('#jfile').onchange=async e=>{const f=e.target.files[0]; if(f) $('#jin').value=await f.text();};
  $('#doimp').onclick=()=>{ try{ const d=JSON.parse($('#jin').value); if(d.section!=='work'||!Array.isArray(d.entries)||!Array.isArray(d.staff)) throw 0; delete d.section; W=normalize(d); closeModal(); render(); push({action:'replaceAll',data:W},'تم الاستيراد'); }
    catch(e){ $('#imp-err').innerHTML='<div class="errors" role="alert">النص غير صالح لقسم المهام.</div>'; } };
}
function resetData(){
  openModal(`${head('استعادة البيانات التجريبية')}<div class="modal-body"><p style="margin-top:0">ستُستبدل كل بيانات المهام (الأعمال والموظفون والمستهدفات) بالبيانات التجريبية${SHEET_URL?' <b>في جدول البيانات المشترك لكل المستخدمين</b>':''}.</p></div><div class="modal-foot"><button class="btn danger" id="dores">${icon('reset')}استعادة</button><button class="btn" data-close>إلغاء</button></div>`,true);
  $('#dores').onclick=()=>{W=seedWork();closeModal();render();push({action:'replaceAll',data:W},SHEET_URL?'تم رفع البيانات التجريبية إلى الجدول':'تمت الاستعادة');};
}
async function copyText(txt,el){ try{await navigator.clipboard.writeText(txt);toast('تم النسخ');}catch(e){ if(el){el.select();} toast('حدّد النص وانسخه يدوياً'); } }

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-add],[data-edit],[data-del],[data-manage],[data-close],[data-act],[data-copy],[data-copy-box]'); if(!t){ if(e.target.id==='modal-bg') closeModal(); return; }
  if(t.dataset.view){ closeModal(); go(t.dataset.view); }
  else if(t.dataset.add) openForm(t.dataset.add,null,t.dataset.back);
  else if(t.dataset.edit){ const [k,id]=t.dataset.edit.split(':'); openForm(k,id,k==='entries'?'':k); }
  else if(t.dataset.del){ const [k,id]=t.dataset.del.split(':'); confirmDelete(k,id); }
  else if(t.dataset.manage) manage(t.dataset.manage);
  else if('close' in t.dataset) closeModal();
  else if(t.dataset.copy) copyText(t.dataset.copy,t.parentNode.querySelector('input'));
  else if('copyBox' in t.dataset) copyText($('#jbox').value,$('#jbox'));
  else { const a=t.dataset.act; if(a==='share') shareLinks(); else if(a==='data') dataMenu(); else if(a==='export') exportData(); else if(a==='import') importData(); else if(a==='reset') resetData(); else if(a==='more'){F.tasks.all=true;render();} else if(a==='refresh') pull(); else if(a==='mgr-out'){ try{sessionStorage.removeItem('nwc-mgr');}catch(_){} window.__mgr=0; go('home'); } }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#modal-bg').classList.contains('open')) closeModal(); });
const tip=$('#tip');
document.addEventListener('mousemove',e=>{ const t=e.target.closest('[data-tip]'); if(!t){tip.classList.remove('show');return;} tip.textContent=t.dataset.tip; tip.classList.add('show'); const w=tip.offsetWidth; tip.style.left=Math.min(window.innerWidth-w-8,Math.max(8,e.clientX-w/2))+'px'; tip.style.top=(e.clientY-tip.offsetHeight-12)+'px'; });
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if((h||'home')!==current) go(h||'home');});
go(location.hash.slice(1)||'home');
if(SHEET_URL) pull(true);
</script>
